<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            color: #0f3460;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
            color: #e94560;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
            color: #0f3460;
        }

        input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #0f3460;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .value-display {
            float: right;
            font-weight: bold;
            color: #e94560;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 10px;
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .status-indicator.disconnected .status-dot {
            background: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
        }

        .status-text {
            font-size: 1.1em;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .connect-btn {
            background: #4caf50;
            color: white;
        }

        .connect-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .connect-btn.connected {
            background: #f44336;
        }

        .home-btn {
            background: #2196f3;
            color: white;
        }

        .home-btn:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #ff9800;
            color: white;
        }

        .reset-btn:hover {
            background: #f57c00;
            transform: translateY(-2px);
        }

        .status-panel {
            text-align: center;
        }

        .status-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 10px;
        }

        .status-label {
            font-size: 1.1em;
            color: #0f3460;
        }

        .log-panel {
            height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
        }

        .log-time {
            color: #4caf50;
            margin-right: 10px;
        }

        .log-info {
            color: #2196f3;
        }

        .log-success {
            color: #4caf50;
        }

        .log-error {
            color: #f44336;
        }

        .log-warn {
            color: #ff9800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Robot Arm Control</h1>

        <div class="dashboard">
            <div class="panel">
                <h2>Controls</h2>

                <div class="status-indicator" id="connectionStatus">
                    <div class="status-dot"></div>
                    <span class="status-text">Disconnected</span>
                </div>

                <div class="buttons">
                    <button class="connect-btn" id="connectBtn" onclick="toggleConnection()">Connect</button>
                    <button class="home-btn" onclick="sendCommand('home')">Home</button>
                    <button class="reset-btn" onclick="sendCommand('reset')">Reset</button>
                </div>

                <div class="control-group">
                    <label>
                        Base Rotation <span class="value-display" id="baseValue">0°</span>
                    </label>
                    <input type="range" id="base" min="-180" max="180" value="0" oninput="updateValue('base')">
                </div>

                <div class="control-group">
                    <label>
                        Shoulder <span class="value-display" id="shoulderValue">0°</span>
                    </label>
                    <input type="range" id="shoulder" min="-90" max="90" value="0" oninput="updateValue('shoulder')">
                </div>

                <div class="control-group">
                    <label>
                        Elbow <span class="value-display" id="elbowValue">0°</span>
                    </label>
                    <input type="range" id="elbow" min="-135" max="135" value="0" oninput="updateValue('elbow')">
                </div>

                <div class="control-group">
                    <label>
                        Wrist <span class="value-display" id="wristValue">0°</span>
                    </label>
                    <input type="range" id="wrist" min="-90" max="90" value="0" oninput="updateValue('wrist')">
                </div>

                <div class="control-group">
                    <label>
                        Gripper <span class="value-display" id="gripperValue">50%</span>
                    </label>
                    <input type="range" id="gripper" min="0" max="100" value="50" oninput="updateValue('gripper')">
                </div>
            </div>

            <div class="panel">
                <h2>Status</h2>

                <div class="status-panel">
                    <div class="status-value" id="statusValue">OFFLINE</div>
                    <div class="status-label">Robot Status</div>
                </div>

                <div class="control-group">
                    <label>
                        Speed <span class="value-display" id="speedValue">50%</span>
                    </label>
                    <input type="range" id="speed" min="10" max="100" value="50" oninput="updateValue('speed')">
                </div>

                <div class="control-group">
                    <label>
                        Torque <span class="value-display" id="torqueValue">70%</span>
                    </label>
                    <input type="range" id="torque" min="10" max="100" value="70" oninput="updateValue('torque')">
                </div>

                <h2>Activity Log</h2>
                <div class="log-panel" id="logPanel">
                    <div class="log-entry">
                        <span class="log-time">[System]</span>
                        <span class="log-info">Dashboard initialized</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isConnected = false;
        let connectionInterval = null;

        function updateValue(id) {
            const value = document.getElementById(id).value;
            const display = document.getElementById(id + 'Value');
            const unit = id === 'gripper' || id === 'speed' || id === 'torque' ? '%' : '°';
            display.textContent = value + unit;

            if (isConnected) {
                sendCommand(id, value);
            }
        }

        function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const status = document.getElementById('connectionStatus');
            const statusText = status.querySelector('.status-text');
            const statusValue = document.getElementById('statusValue');

            if (!isConnected) {
                // Connect
                isConnected = true;
                btn.textContent = 'Disconnect';
                btn.classList.add('connected');
                status.classList.remove('disconnected');
                statusText.textContent = 'Connected';
                statusValue.textContent = 'ONLINE';
                statusValue.style.color = '#4caf50';
                addLog('Connected to robot arm controller', 'success');

                // Simulate connection
                connectionInterval = setInterval(() => {
                    const randomStatus = Math.random() > 0.1 ? 'ONLINE' : 'BUSY';
                    statusValue.textContent = randomStatus;
                }, 2000);

            } else {
                // Disconnect
                isConnected = false;
                btn.textContent = 'Connect';
                btn.classList.remove('connected');
                status.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
                statusValue.textContent = 'OFFLINE';
                statusValue.style.color = '#f44336';
                addLog('Disconnected from robot arm controller', 'warn');

                if (connectionInterval) {
                    clearInterval(connectionInterval);
                    connectionInterval = null;
                }
            }
        }

        function sendCommand(command, value = null) {
            const commands = {
                base: `base:${value}`,
                shoulder: `shoulder:${value}`,
                elbow: `elbow:${value}`,
                wrist: `wrist:${value}`,
                gripper: `gripper:${value}`,
                speed: `speed:${value}`,
                torque: `torque:${value}`,
                home: 'home',
                reset: 'reset'
            };

            if (commands[command]) {
                addLog(`Sending: ${commands[command]}`, 'info');

                // Simulate sending
                setTimeout(() => {
                    if (command === 'home') {
                        addLog('Robot moved to home position', 'success');
                    } else if (command === 'reset') {
                        addLog('Robot reset complete', 'success');
                    }
                }, 500);
            }
        }

        function addLog(message, type = 'info') {
            const logPanel = document.getElementById('logPanel');
            const now = new Date();
            const time = now.toLocaleTimeString();

            const entry = document.createElement('div');
            entry.className = 'log-entry';

            let logClass = 'log-info';
            if (type === 'success') logClass = 'log-success';
            if (type === 'error') logClass = 'log-error';
            if (type === 'warn') logClass = 'log-warn';

            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="${logClass}">${message}</span>
            `;

            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' && isConnected) {
                sendCommand('home');
            } else if (e.key === 'r' && isConnected) {
                sendCommand('reset');
            }
        });

        // Initialize
        addLog('Press H for home, R for reset', 'warn');
    </script>
</body>
</html>
